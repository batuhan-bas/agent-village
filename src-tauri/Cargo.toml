[package]
name = "agent-village"
version = "1.0.0"
description = "Watch your coding agents work in a pixel village"
authors = ["batuhan-bas"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "agent_village_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
